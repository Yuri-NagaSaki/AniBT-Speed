name: Verify and build native worker
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: ./test.sh
      - run: ./scripts/build.sh amd64 && ./scripts/build.sh arm64
      - uses: actions/upload-artifact@v4
        with:
          name: anibt-linux
          path: dist/
