[project]
name = "anibt-speed"
version = "1.0.0"
description = "AniBT single-controller seeding and media worker"
requires-python = ">=3.14"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "feedparser>=6,<7",
]

[dependency-groups]
dev = ["ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
