services:
  worker:
    image: ${ANIBT_SPEED_IMAGE:-ghcr.io/yuri-nagasaki/anibt-speed:latest}
    build:
      context: .
      args:
        BUILD_REVISION: ${BUILD_REVISION:-development}
    container_name: anibt-speed
    init: true
    env_file: worker.env
    environment:
      STATE_DIR: /app/data
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./data:/app/data
      - ${MEDIA_HOST_PATH:-/hdd/media}:${MEDIA_CONTAINER_PATH:-/media}:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
